global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "backend-app"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:3000"]
        labels:
          environment: "production"
          service: "backend-application"

  - job_name: "auto-healer"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["auto-healer:4000"]
        labels:
          environment: "production"
          service: "auto-recovery-daemon"
