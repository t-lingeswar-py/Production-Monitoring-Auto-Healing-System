name: Production Monitoring & Auto-Healing CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: 🧪 Unit Testing & Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            app/package.json
            auto-healer/package.json
            dashboard/package.json

      - name: Install & Validate Backend App
        run: |
          cd app
          npm ci
          node -e "require('./src/index.js')" &
          BACKEND_PID=$!
          sleep 2
          kill $BACKEND_PID || true

      - name: Install & Validate Auto-Healer Service
        run: |
          cd auto-healer
          npm ci
          node -e "require('./src/state.js')"

      - name: Install & Validate Command Center Dashboard
        run: |
          cd dashboard
          npm ci

  validate-monitoring-config:
    name: 🔍 Prometheus & Alertmanager Config Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download & Run Promtool
        run: |
          PROM_VER="2.48.0"
          curl -sSLo promtool.tar.gz https://github.com/prometheus/prometheus/releases/download/v${PROM_VER}/prometheus-${PROM_VER}.linux-amd64.tar.gz
          tar -xzf promtool.tar.gz
          ./prometheus-${PROM_VER}.linux-amd64/promtool check rules prometheus/alert_rules.yml
          ./prometheus-${PROM_VER}.linux-amd64/promtool check config prometheus/prometheus.yml

  docker-build:
    name: 🐳 Docker Container Build & Security Audit
    runs-on: ubuntu-latest
    needs: [lint-and-test, validate-monitoring-config]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Application Container
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          tags: production-monitoring-backend:latest

      - name: Build Auto-Healer Daemon Container
        uses: docker/build-push-action@v5
        with:
          context: ./auto-healer
          file: ./auto-healer/Dockerfile
          push: false
          tags: auto-healer-service:latest

      - name: Build Command Center Dashboard Container
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          push: false
          tags: monitoring-command-center:latest

  integration-test:
    name: 🛡️ End-to-End Auto-Healing Workflow Test
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Docker Compose Stack
        run: |
          docker compose up -d --build
          sleep 10

      - name: Verify Service Health
        run: |
          curl -f http://localhost:3000/api/health
          curl -f http://localhost:4000/health
          curl -f http://localhost:5000/api/overview

      - name: Inject Chaos (Sever DB Connection) & Verify Auto-Healing
        run: |
          echo "Simulating Database connection failure..."
          curl -X POST http://localhost:3000/api/chaos/db-disconnect
          sleep 2
          echo "Triggering Auto-Recovery webhook..."
          curl -X POST http://localhost:4000/api/healer/trigger-manual-healing \
            -H "Content-Type: application/json" \
            -d '{"alertName":"DatabaseConnectionLost","severity":"critical"}'
          sleep 2
          echo "Verifying backend DB reconnected automatically..."
          curl -f http://localhost:3000/api/health

      - name: Teardown Stack
        if: always()
        run: docker compose down
