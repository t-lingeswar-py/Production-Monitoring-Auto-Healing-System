version: '3.8'

services:
  # 1. Database (PostgreSQL)
  database:
    image: postgres:15-alpine
    container_name: production_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pass
      POSTGRES_DB: production_monitoring
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d production_monitoring"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 2. Backend Application
  backend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: backend_app
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres_secure_pass
      DB_NAME: production_monitoring
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  # 3. Prometheus Metrics & Alerting Server
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: prometheus_server
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
    ports:
      - "9090:9090"
    depends_on:
      - backend
    restart: unless-stopped

  # 4. Alertmanager
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: alert_manager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    depends_on:
      - prometheus
    restart: unless-stopped

  # 5. Auto-Recovery Webhook Daemon
  auto-healer:
    build:
      context: ./auto-healer
      dockerfile: Dockerfile
    container_name: auto_healer_daemon
    ports:
      - "4000:4000"
    environment:
      AUTO_HEALER_PORT: 4000
      BACKEND_URL: http://backend:3000
    depends_on:
      - backend
      - alertmanager
    restart: unless-stopped

  # 6. Grafana Visualization Dashboard
  grafana:
    image: grafana/grafana:10.2.2
    container_name: grafana_dashboard
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped

  # 7. Visual Command Center & Chaos Engineering Dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: command_center_ui
    ports:
      - "5000:5000"
    environment:
      DASHBOARD_PORT: 5000
      BACKEND_URL: http://backend:3000
      HEALER_URL: http://auto-healer:4000
      GRAFANA_URL: http://localhost:3001
      PROMETHEUS_URL: http://localhost:9090
      ALERTMANAGER_URL: http://localhost:9093
    depends_on:
      - backend
      - auto-healer
    restart: unless-stopped
