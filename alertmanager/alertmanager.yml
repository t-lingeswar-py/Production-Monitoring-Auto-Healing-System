global:
  resolve_timeout: 1m

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 2s
  group_interval: 2s
  repeat_interval: 1m
  receiver: 'auto-healing-webhook'

receivers:
  - name: 'auto-healing-webhook'
    webhook_configs:
      - url: 'http://auto-healer:4000/webhook/alerts'
        send_resolved: true
        http_config:
          follow_redirects: true
